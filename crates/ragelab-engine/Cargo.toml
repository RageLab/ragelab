[package]
name = "ragelab-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
bincode = "1.3"
png = "0.17"
ragelab-assets = { path = "../ragelab-assets" }
ragelab-hash = { path = "../ragelab-hash" }
ragelab-meta = { path = "../ragelab-meta" }
ragelab-resource = { path = "../ragelab-resource" }
ragelab-rpf = { path = "../ragelab-rpf" }
ragelab-ymap = { path = "../ragelab-ymap" }
ragelab-ymf = { path = "../ragelab-ymf" }
ragelab-ybn = { path = "../ragelab-ybn" }
ragelab-ydd = { path = "../ragelab-ydd" }
ragelab-ydr = { path = "../ragelab-ydr" }
ragelab-yft = { path = "../ragelab-yft" }
ragelab-ytd = { path = "../ragelab-ytd" }
ragelab-ytyp = { path = "../ragelab-ytyp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[lints]
workspace = true
