ragelab-resource = { path = "../ragelab-resource" }
ragelab-ymap = { path = "../ragelab-ymap" }
ragelab-ymf = { path = "../ragelab-ymf" }
ragelab-ybn = { path = "../ragelab-ybn" }
ragelab-ydd = { path = "../ragelab-ydd" }
