[package]
name = "ragelab-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.29"
# Resolver pin: newer indexmap manifests require Cargo edition2024 support;
# RageLab intentionally remains buildable with workspace Rust/Cargo 1.80.
indexmap = "=2.7.1"
png = "0.17"
pollster = "0.3"
ragelab-engine = { path = "../ragelab-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wgpu = "22.1.0"

[lints]
workspace = true
