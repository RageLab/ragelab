[package]
name = "ragelab-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "=0.3.77"
ragelab-authoring = { path = "../ragelab-authoring" }
ragelab-meta = { path = "../ragelab-meta" }
ragelab-ymap = { path = "../ragelab-ymap" }
ragelab-ytyp = { path = "../ragelab-ytyp" }
ragelab-ydr = { path = "../ragelab-ydr" }
ragelab-ydd = { path = "../ragelab-ydd" }
ragelab-yft = { path = "../ragelab-yft" }
ragelab-ytd = { path = "../ragelab-ytd" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.100"

[dev-dependencies]
ragelab-resource = { path = "../ragelab-resource" }
wasm-bindgen-test = "=0.3.50"

[lints]
workspace = true
